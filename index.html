<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>NAYA LUXE - Interiors & Decors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Custom styles */
      body {
        background-color: #ebeed9; /* pale olive yellowish */
        background-image: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(235, 238, 217, 0) 100%);
        background-attachment: fixed;
        color: #2b331f; /* dark font */
      }
      
      @keyframes float-soft {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); box-shadow: 0 25px 40px rgba(110, 120, 80, 0.15); }
        100% { transform: translateY(0px); }
      }

      @keyframes float-gentle {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
        100% { transform: translateY(0px); }
      }

      /* Make all cards/white containers float slightly and adapt background */
      div.bg-white, div.bg-gray-50, div.bg-brand-light-grey, .rounded-2xl {
        animation: float-soft 6s ease-in-out infinite;
      }
      
      /* Make icons float gently */
      svg, img, button {
        animation: float-gentle 4s ease-in-out infinite;
      }

      /* Keep form elements distinct */
      input, select, textarea {
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      
      /* Keep specific icon colors if they had them, don't let color override ruin SVGs completely if they can be helped, though some might use currentColor */
      svg {
        stroke: currentColor;
      }
    </style>
    <script>
      /* Tailwind config */
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "brand-gold": "#D4AF37",
              "brand-grey": "#222222",
              "brand-light-grey": "#f8f8f8",
              "brand-white": "#ffffff",
              "brand-black": "#000000",
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
              display: ["Cinzel", "serif"],
            },
          },
        },
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body class="selection:bg-gray-200 selection:text-gray-900">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
